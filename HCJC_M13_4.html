<html>
    <head>
        <title>List and Interlinking webpage</title>
    </head>
    <body>
        <!-- List -->
        <!-- Ordered List -->
        <ol>
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
            <li>Six</li>
        </ol>  
        <!-- Unordered List -->
        <ul>
            <li>One</li>
            <li>Two</li>
            <li>Three</li>
            <li>Four</li>
            <li>Five</li>
        </ul>
        <!-- Unordered Lidt & Types -->
         <ul>
            <li type="circle">One</li>
            <li type="square">Two</li>
            <li type="none">Three</li>
            <li type="Disc">Four</li>
            <li>Five</li>           
         </ul>
         <!-- Ordered List and types -->
          <ol>
            <li type="a">One</li>
            <li type="a">One</li>
            <li type="A">Two</li>
            <li type="A">Two</li>
            <li type="i">Three</li>
            <li type="i">Three</li>
            <li type="I">Four</li>
            <li type="I">Four</li>
            <li type="1">Five</li>
            <li type="1">Five</li>
          </ol>
          <!-- Description List -->
           <dl>
            <dt>Iphone 14</dt>
            <dd>A13 chip</dd>
            <dt>Iphone 13</dt>
            <dd>A13 chip</dd>
           </dl>
           <!-- Interlinking -->
            <a href="https://www.google.com/" target="_blank">google</a>
    </body>
</html>
