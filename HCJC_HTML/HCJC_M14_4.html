<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>Forms Demo</title>
  </head>
  <body>
    <h1>Hi</h1>
    <fieldset>
      <legend>Form</legend>
      <form>
        <label for="Name"> Enter Your Name : </label>
        <input type="text" id="Name" name="UserName" />
        <br />
        <br />
        <br />
        <br />
        <label for="Address">Enter Your Address : </label>
        <textarea rows="10" cols="30" id="Address" name="UserAdd"></textarea>
        <br />
        <br />
        <br />
        <br />
        <label for="DOB">DOB : </label>
        <input type="date" id="DOB" name="UserDOB" />
        <br />
        <br />
        <br />
        <label for="Pass">Password : </label>
        <input type="password" id="Pass" name="UserPass" />
        <br />
        Select Your Gender : <br />

        <label for="Male">Male :</label>
        <input type="radio" id="Male" name="Gender" /><br />

        <label for="Female">Female :</label>
        <input type="radio" id="Female" name="Gender" />
        <br /><br /><br />
        Select favorite Movies : <br />
        <label for="ave">Avengers</label>
        <input type="checkbox" name="Avengers" id="ave" /><br />
        <label for="Thor">Thor</label>
        <input type="checkbox" name="Thor" id="Thor" /><br />
        <label for="IM">Ironman</label>
        <input type="checkbox" name="Ironman" id="IM" /><br />
        <input type="submit" value="Submit" />
      </form>
    </fieldset>
  </body>
</html>
