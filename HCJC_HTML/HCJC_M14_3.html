<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Hi</h1>
    <table border cellpadding="16px" cellspacing="10px" height="60px" width="00px" bordercolor="red">
        <tr>
            <th>Sr no.</th>
            <th>Sub 1</th>
            <th>Sub 2</th>
            <th>Sub 3</th>
        </tr>
        <tr>
            <td>1</td>
            <td>English</td>
            <td colspan="2">Science</td>
        </tr>
        <tr>
            <td>2</td>
            <td>English</td>
            <td>Science</td>
            <td rowspan="2">Computer</td>
        </tr>
        <tr>
            <td>3</td>
            <td>English</td>
            <td>Science</td>
        </tr>
    </table>
</body>
</html>
