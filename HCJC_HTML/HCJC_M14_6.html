<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
</head>
<body>
  <fieldset>
    <legend>User Registration !!</legend>
    <form method="get">
      <label for="UserName">Enter Your Username : </label>
      <input type="text" id="UserName" name="UserName" value="Abhranil"><br><br>

      <label for="Country">Country : </label>
      <input type="text" id="Country" name="Country" value="India"  disabled><br><br>

      <label for="UserEmail">Enter Your Email : </label>
      <input type="text" id="UserEmail" name="UserEmail" placeholder="abhra@gmail.com" autofocus ><br><br>

      <label for="password">Enter Your Password : </label>
      <input type="password" id="password" name="password"><br><br>

      Select Your Gender : <br>
      <label for="Male">Male :</label>
      <input type="radio" id="Male" name="Gender" value="Male"><br>
      <label for="Female">Female :</label>
      <input type="radio" id="Female" name="Gender" value="Female"><br>
      <label for="Transgender">Transgender :</label>
      <input type="radio" id="Transgender" name="Gender" value="Transgender"><br><br>

      <input type="number" min="0" max="8">

      <input type="submit" value="Submit Form">
    </form>
    
  </fieldset>
</body>
</html>
